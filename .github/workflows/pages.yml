name: Publish static COMPAS lesson

on:
  push:
    branches: [main]
    paths:
      - "compas_ifc_compas_viewer_intro.ipynb"
      - "build_site.py"
      - "style.css"
      - "viewer_detached.py"
      - "README.md"
      - "sample_building.ifc"
      - "binder/environment.yml"
      - "check_lesson.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install compas==2.15.1 compas_ifc==2.1.0
      - run: python check_lesson.py

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out lesson source
        uses: actions/checkout@v6
      - name: Build static HTML without executing notebook cells
        run: python build_site.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

